name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.4
      - run: ruff check arena tests
      - run: ruff format --check arena tests

  backend:
    name: Backend tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements-dev.txt -c requirements.lock
      - run: pip check
      - run: python -m pytest -q

  frontend:
    name: Frontend build (TypeScript strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run test:i18n --prefix frontend
      - run: npm run build --prefix frontend

  e2e:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt -c requirements.lock
      - name: Build frontend
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: npm run test:browser --prefix frontend
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["frontend", "data", "test-results"]

[tool.ruff.lint]
# Pyflakes, import order, pyupgrade, bugbear and the error subset of pycodestyle.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
# zip(strict=...) would change runtime behavior on mismatched inputs; opt in case by case.
ignore = ["B905"]

[tool.ruff.lint.isort]
known-first-party = ["arena", "tests"]

combine-as-imports = true
